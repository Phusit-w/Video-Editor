<title>AMOURIQ Idea Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow reading column of Core Idea cards, newest first; Idea Gate actions sit at the foot of each Proposed card. Brand styling arrives in ticket 7. */
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --fg: #2b2a26;
  --muted: #6f6c63;
  --line: #e2ded4;
  --accent: #5f6b45;
  --pill-bg: #eceee4;
  --warn-bg: #fbf1dc;
  --warn-fg: #7a5410;
  --hold-bg: #f8e3df;
  --hold-fg: #8a2f22;
  --font-th: "Prompt", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --font-en: "DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c19; --surface: #26261f; --fg: #ecebe4; --muted: #a8a596; --line: #3a3a31; --accent: #b5c290; --pill-bg: #33372a;
    --warn-bg: #3a3020; --warn-fg: #f0cf8a; --hold-bg: #40241f; --hold-fg: #f2a99c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c19; --surface: #26261f; --fg: #ecebe4; --muted: #a8a596; --line: #3a3a31; --accent: #b5c290; --pill-bg: #33372a;
  --warn-bg: #3a3020; --warn-fg: #f0cf8a; --hold-bg: #40241f; --hold-fg: #f2a99c;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-th); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
h1 { font-size: 1.5rem; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; margin: 0; }
.status-line { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; display: grid; gap: 8px; min-width: 0;
}
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font-family: var(--font-en); font-size: .75rem; letter-spacing: .02em;
  background: var(--pill-bg); color: var(--accent); border-radius: 999px; padding: 2px 10px;
}
.pill.status { background: var(--accent); color: var(--surface); }
.pill.claim-warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.claim-hold { background: var(--hold-bg); color: var(--hold-fg); }
.hook { font-size: 1.05rem; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
.msg { margin: 0; color: var(--fg); overflow-wrap: anywhere; }
.note { margin: 0; font-size: .9rem; border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; display: grid; gap: 4px; }
.note.warn { background: var(--warn-bg); color: var(--warn-fg); }
.note.hold, .note.error { background: var(--hold-bg); color: var(--hold-fg); }
.note.plain { background: var(--pill-bg); color: var(--fg); }
.note ul { margin: 0; padding-left: 1.2em; }
.ack { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; cursor: pointer; }
.ack input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--warn-fg); flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
button {
  font: inherit; font-size: .9rem; font-weight: 500; min-height: 40px; padding: 6px 16px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, textarea:focus-visible, .ack input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.blocked { margin: 0; font-size: .82rem; color: var(--muted); }
.compose { display: grid; gap: 8px; }
.compose label { font-size: .9rem; font-weight: 500; }
textarea {
  font: inherit; font-size: .95rem; width: 100%; box-sizing: border-box; min-height: 72px; resize: vertical;
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg);
}
.foot { font-family: var(--font-en); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.empty {
  border: 1px dashed var(--line); border-radius: 10px; padding: 24px 16px;
  color: var(--muted); text-align: center;
}
</style>

<div class="wrap">
  <header>
    <h1>Idea Board</h1>
    <p class="sub">Core Idea ทั้งหมดและสถานะ — อนุมัติ ขอแก้ หรือไม่อนุมัติได้ที่การ์ดที่รอ Idea Gate</p>
  </header>
  <div class="status-line" id="statusLine">กำลังโหลด Core Idea…</div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>ยังไม่มี Core Idea — รอบ Ideation ถัดไปจะเขียนลงที่นี่</div>
</div>

<script type="module">
import { validateCoreIdea, applyTransition } from "./core-idea-rules.js";

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const statusLine = document.getElementById("statusLine");

let ideas = [];
let db = null;
let canDecide = false;
// Per-card UI state that must survive re-renders from live snapshots:
// id -> { mode: null | "Revise" | "Rejected", draft, ack, busy, error }
const ui = new Map();
function uiFor(id) {
  if (!ui.has(id)) ui.set(id, { mode: null, draft: "", ack: false, busy: false, error: "" });
  return ui.get(id);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function button(label, cls, onClick) {
  const b = el("button", cls, label);
  b.type = "button";
  b.addEventListener("click", onClick);
  return b;
}

function note(kind, title, body) {
  const n = el("div", "note " + kind);
  if (title) n.append(el("strong", null, title));
  if (Array.isArray(body)) {
    const ul = el("ul");
    for (const line of body) ul.append(el("li", null, line));
    n.append(ul);
  } else if (body) n.append(el("span", null, body));
  return n;
}

function gate(idea) {
  const s = uiFor(idea.id);
  const box = el("div", "compose");

  if (idea.claimStatus === "ต้องระวัง") {
    const ack = el("label", "ack");
    const cb = el("input");
    cb.type = "checkbox";
    cb.id = "ack-" + idea.id;
    cb.checked = s.ack;
    cb.disabled = s.busy;
    cb.addEventListener("change", () => { s.ack = cb.checked; render(); });
    ack.append(cb, el("span", null, "รับทราบความเสี่ยงของ Claim นี้แล้ว และตั้งใจอนุมัติ"));
    box.append(ack);
  }

  if (s.mode) {
    const isRevise = s.mode === "Revise";
    const fieldId = "draft-" + idea.id;
    const label = el("label", null, isRevise ? "ให้ Ideation แก้อะไร" : "Rejection Reason (Ideation จะอ่านก่อนเสนอชุดถัดไป)");
    label.htmlFor = fieldId;
    const ta = el("textarea");
    ta.id = fieldId;
    ta.value = s.draft;
    ta.disabled = s.busy;
    const send = button(isRevise ? "ส่งขอแก้" : "ยืนยันไม่อนุมัติ", "primary", () =>
      decide(idea.id, isRevise ? { actor: "Human", to: "Revise", comment: s.draft } : { actor: "Human", to: "Rejected", reason: s.draft }));
    send.disabled = s.busy || !s.draft.trim();
    ta.addEventListener("input", () => { s.draft = ta.value; send.disabled = s.busy || !s.draft.trim(); });
    const cancel = button("ยกเลิก", null, () => { s.mode = null; s.draft = ""; s.error = ""; render(); });
    cancel.disabled = s.busy;
    const row = el("div", "actions");
    row.append(send, cancel);
    box.append(label, ta, row);
  } else {
    // The Rules decide whether Approve is possible; the board only reflects that.
    const approveCheck = applyTransition(idea, { actor: "Human", to: "Approved", riskAcknowledged: s.ack });
    const approve = button("อนุมัติ", "primary", () => decide(idea.id, { actor: "Human", to: "Approved", riskAcknowledged: s.ack }));
    approve.id = "approve-" + idea.id;
    approve.disabled = s.busy || !approveCheck.ok;
    const revise = button("ขอแก้", null, () => { s.mode = "Revise"; s.error = ""; render(idea.id); });
    const reject = button("ไม่อนุมัติ", null, () => { s.mode = "Rejected"; s.error = ""; render(idea.id); });
    revise.disabled = reject.disabled = s.busy;
    const row = el("div", "actions");
    row.append(approve, revise, reject);
    box.append(row);
    // HOLD and invalid records already explain themselves in their notes above.
    if (!approveCheck.ok && approveCheck.code === "risk-not-acknowledged") {
      const why = el("p", "blocked", approveCheck.reason);
      why.id = "why-" + idea.id;
      approve.setAttribute("aria-describedby", why.id);
      box.append(why);
    }
  }

  if (s.busy) box.append(el("p", "blocked", "กำลังบันทึก…"));
  if (s.error) box.append(note("error", null, s.error));
  return box;
}

function card(idea) {
  const c = el("article", "card");
  const meta = el("div", "meta");
  meta.append(el("span", "pill status", idea.status || "—"));
  if (idea.primaryPillar) meta.append(el("span", "pill", idea.primaryPillar));
  if (idea.productLinkage) meta.append(el("span", "pill", idea.productLinkage + (idea.sku ? " · " + idea.sku : "")));
  if (idea.claimStatus) {
    const cls = idea.claimStatus === "HOLD" ? " claim-hold" : idea.claimStatus === "ต้องระวัง" ? " claim-warn" : "";
    meta.append(el("span", "pill" + cls, "Claim: " + idea.claimStatus));
  }
  c.append(meta);
  c.append(el("p", "hook", idea.hook || "(ไม่มี Hook)"));
  if (idea.keyMessage) c.append(el("p", "msg", idea.keyMessage));

  if (idea.claimStatus === "HOLD") c.append(note("hold", "HOLD — อนุมัติไม่ได้", idea.claimReason || "ไม่มีเหตุผลระบุ"));
  else if (idea.claimStatus === "ต้องระวัง") c.append(note("warn", "ต้องระวัง", idea.claimReason || "ไม่มีเหตุผลระบุ"));

  const check = validateCoreIdea(idea);
  if (!check.ok) c.append(note("error", "ยังไม่ครบตามกฎ Core Idea — อนุมัติไม่ได้", check.errors.map((e) => e.message)));

  if (idea.status === "Revise" && idea.reviseComment) c.append(note("plain", "ขอแก้", idea.reviseComment));
  if (idea.status === "Rejected" && idea.rejectionReason) c.append(note("plain", "Rejection Reason", idea.rejectionReason));
  if (idea.status === "Approved" && idea.riskAcknowledged) c.append(el("p", "blocked", "อนุมัติโดยรับทราบความเสี่ยงของ Claim แล้ว"));

  if (idea.status === "Proposed" && canDecide) c.append(gate(idea));

  const when = idea.createdAt ? new Date(idea.createdAt).toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }) : "";
  c.append(el("div", "foot", [idea.id, idea.batchId, when].filter(Boolean).join(" · ")));
  return c;
}

// focusDraftOf: an idea id whose Revise/Reject text box should take focus after this render.
function render(focusDraftOf = null) {
  // Keep keyboard focus and typing position across re-renders from live snapshots.
  const active = document.activeElement;
  const activeId = active && active.id;
  const caret = active && active.tagName === "TEXTAREA" ? active.selectionStart : null;

  listEl.replaceChildren(...ideas.map(card));
  emptyEl.hidden = ideas.length > 0;
  const waiting = ideas.filter((i) => i.status === "Proposed").length;
  statusLine.textContent = ideas.length ? `ทั้งหมด ${ideas.length} Core Idea · รอ Idea Gate ${waiting}` : "";

  const target = document.getElementById(focusDraftOf ? "draft-" + focusDraftOf : activeId || "");
  if (target && !target.disabled) {
    target.focus();
    if (caret != null && target.tagName === "TEXTAREA") target.setSelectionRange(caret, caret);
  }
}

async function decide(id, action) {
  const s = uiFor(id);
  s.busy = true; s.error = "";
  render();
  try {
    const ref = db.collection("coreIdeas").doc(id);
    const snap = await ref.get();
    if (!snap.exists) throw new Error("ไม่พบ Core Idea นี้แล้ว");
    const current = { id, ...snap.data() };
    // Re-apply the Rules to the latest stored version, not the copy on screen.
    const result = applyTransition(current, action);
    if (!result.ok) { s.error = result.reason; return; }
    // Write exactly the fields the Rules changed (never the id, which is the document path).
    const patch = { decidedAt: new Date().toISOString() };
    for (const [k, v] of Object.entries(result.record)) {
      if (k !== "id" && v !== current[k]) patch[k] = v;
    }
    await ref.update(patch);
    ui.delete(id);
  } catch (err) {
    // invalid_argument covers both a write below the admin rule and a malformed write.
    s.error = err && err.code === "invalid_argument"
      ? "บันทึกไม่ได้: บัญชีนี้อาจไม่มีสิทธิ์แก้ไข Idea Board (" + (err.message || "invalid_argument") + ")"
      : "บันทึกไม่สำเร็จ: " + (err && err.message ? err.message : "ไม่ทราบสาเหตุ") + " — ลองกดอีกครั้ง";
  } finally {
    s.busy = false;
    render();
  }
}

(async () => {
  const timer = setTimeout(() => {
    statusLine.textContent = "โหลดข้อมูลไม่สำเร็จ — ลองเปิดหน้านี้ใหม่อีกครั้ง";
  }, 10000);
  const [dbNs, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  db = dbNs;
  if (!db) {
    clearTimeout(timer);
    statusLine.textContent = "ต้องลงชื่อเข้าใช้ claude.ai เพื่อดู Core Idea";
    return;
  }
  // coreIdeas is written at admin level (Phase 1: the owner is the sole approver).
  canDecide = user ? await user.canEdit() : false;
  db.collection("coreIdeas").onSnapshot(
    (snap) => {
      clearTimeout(timer);
      ideas = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      ideas.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
      render();
    },
    (err) => {
      clearTimeout(timer);
      statusLine.textContent = "อ่านฐานข้อมูลไม่ได้: " + (err && err.message ? err.message : "ไม่ทราบสาเหตุ");
    }
  );
})();
</script>
